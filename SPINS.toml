[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spins-openmc"
version = "0.1.0"
description = "A neutron source generator for OpenMC"
authors = [{ name = "B. Tate Taczak", email = "btaczak@vols.utk.edu" }]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "numpy",     # add any required packages here
    "pickle",
    "numpy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pandas"]
